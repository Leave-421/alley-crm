# 로컬 실행: 루트 .env(복사본)의 MYSQL_* 값을 읽는다. 테스트는 Testcontainers가 datasource를 덮어쓴다.
spring:
  application:
    name: alley-crm
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:alley_crm}?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${MYSQL_USER:}
    password: ${MYSQL_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway로만 바꾼다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}   # 배포(HTTPS)에서는 true

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  demo-tools:
    enabled: ${DEMO_TOOLS_ENABLED:false}   # 시연용 시각 조작 API(D18). 실제 운영에서는 켜지 않는다
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}   # 자동 거절 · 자동 취소 · 쿠폰 만료 · 예산 해제(D7, NFR-06)
    interval: PT1M
