# 시드 실행 전용 프로필(SeedRunner). 시드만 돌리고 끝난다.
# 웹 컨텍스트는 그대로 띄운다(보안 설정이 웹 환경을 요구함). 다른 서버와 겹치지 않게 임의 포트를 쓰고,
# 시드가 끝나면 실행기가 앱을 닫는다(seed.close-after-run).
# 기본은 dry-run(검사 · 계획 출력만). 실제로 지우고 다시 넣는 것은 실행 인자 --seed.confirm=reset-all-data 를 줄 때만이다.
# 확인 값은 이 파일에 적지 않는다.
server:
  port: 0

seed:
  confirm: ""
  close-after-run: true
  # 가상 데이터(E16 · E17). 가상 손님 수는 기획에서 미결(NFR-07)이라 임시 값. 바꾸려면 --seed.demo.customers=N
  demo:
    customers: 600
    random-seed: 20261211
