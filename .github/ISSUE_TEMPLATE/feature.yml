name: Feature
description: 새로운 기능 또는 사용자 가치 추가
title: "[Feature] "
labels: ["feature"]
body:
  - type: input
    id: requirement
    attributes:
      label: 요구사항 ID
      description: "[요구사항 정의서](https://github.com/Leave-421/alley-crm-docs/blob/main/docs/03-requirements.md)의 ID. 여러 개면 쉼표로 구분합니다."
      placeholder: "예: FR-RSV-01"
    validations:
      required: true

  - type: input
    id: backlog
    attributes:
      label: 백로그 ID · 화면 ID
      description: "[이슈 백로그](https://github.com/Leave-421/alley-crm-docs/blob/main/docs/00-backlog.md)의 ID와, 화면 이슈면 [화면 명세](https://github.com/Leave-421/alley-crm-docs/blob/main/docs/07-screens.md)의 화면 ID."
      placeholder: "예: A8 · G-02"
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: 문제 / 목적
      description: 무엇을 해결하려는지 한두 줄이면 충분합니다.
      placeholder: 사장님이 ... 할 수 없어 ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: "끝났는지 판단할 기준. [기능 명세](https://github.com/Leave-421/alley-crm-docs/blob/main/docs/04-features.md)의 인수 조건을 옮겨도 됩니다."
      placeholder: |
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 범위 메모
      description: 포함할 것 · 하지 않을 것이 헷갈릴 때만 적습니다.
      placeholder: |
        - 포함: ...
        - 제외: ...
    validations:
      required: false

  - type: textarea
    id: blocked_by
    attributes:
      label: 선행
      description: 먼저 끝나야 하는 이슈. 이슈 번호(#N)로 적습니다.
      placeholder: |
        - #...
    validations:
      required: false

  - type: textarea
    id: mockup_diff
    attributes:
      label: 목업과 다른 점
      description: "화면 이슈만 적습니다. 임시 목업과 화면 명세를 대조한 결과이며, **화면 명세가 목업보다 우선**합니다. 목업을 고치면 해결된 줄을 지웁니다."
      placeholder: |
        - 넣을 것 (목업에 없음): ...
        - 뺄 것 (명세에 없음): ...
        - 바꿀 것 (값 · 상태 · 문구): ...
    validations:
      required: false
